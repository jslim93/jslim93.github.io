- title: Research Profile
  type: list
  contents:
    - "Atmospheric physicist studying how droplets and ice crystals shape cloud evolution, precipitation, radiation, and climate. Combines Lagrangian cloud modeling, large-eddy simulation, stochastic dynamics, observational constraints, and scientific software across warm and mixed-phase cloud systems."

- title: Current Research Directions
  type: list
  contents:
    - "<b>Particle histories and cloud evolution.</b> How do growth, mixing, collision, and transport shape cloud particles over their lifetimes?"
    - "<b>Cloud transitions and climate.</b> How do microphysics and variability govern whether clouds produce precipitation, change phase, persist, or dissipate?"
    - "<b>Model development and evaluation.</b> How can observational constraints and particle-based models connect microscopic processes with cloud evolution and climate-relevant effects?"

